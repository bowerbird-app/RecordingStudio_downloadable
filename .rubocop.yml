AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_downloadable/engine.rb'
    - 'lib/recording_studio/capabilities/downloadable.rb'
    - 'lib/recording_studio_downloadable/authorization.rb'
    - 'lib/recording_studio_downloadable/configuration.rb'
    - 'app/controllers/recording_studio_downloadable/packages_controller.rb'
    - 'lib/generators/**/*'

Metrics/ModuleLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio/capabilities/downloadable.rb'
    - 'lib/recording_studio_downloadable/authorization.rb'
    - 'app/helpers/recording_studio_downloadable/application_helper.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio/capabilities/downloadable.rb'
    - 'lib/recording_studio_downloadable/engine.rb'
    - 'lib/recording_studio_downloadable/authorization.rb'
    - 'lib/recording_studio_downloadable/sources/attachments.rb'
    - 'lib/recording_studio_downloadable/sources/manifest.rb'
    - 'lib/recording_studio_downloadable/download_file.rb'
    - 'lib/recording_studio_downloadable/filename.rb'
    - 'app/services/recording_studio_downloadable/services/**/*'
    - 'app/helpers/recording_studio_downloadable/application_helper.rb'
    - 'app/controllers/recording_studio_downloadable/packages_controller.rb'
    - 'lib/recording_studio_downloadable/invalidation.rb'
    - 'db/migrate/**/*'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio/capabilities/downloadable.rb'
    - 'lib/recording_studio_downloadable/engine.rb'
    - 'lib/recording_studio_downloadable/authorization.rb'
    - 'lib/recording_studio_downloadable/sources/attachments.rb'
    - 'lib/recording_studio_downloadable/sources/manifest.rb'
    - 'lib/recording_studio_downloadable/download_file.rb'
    - 'app/services/recording_studio_downloadable/services/**/*'
    - 'app/helpers/recording_studio_downloadable/application_helper.rb'
    - 'lib/recording_studio_downloadable/fingerprint.rb'
    - 'lib/recording_studio_downloadable/rate_limiter.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_downloadable/engine.rb'
    - 'lib/recording_studio_downloadable/authorization.rb'
    - 'lib/recording_studio_downloadable/sources/attachments.rb'
    - 'lib/recording_studio_downloadable/sources/manifest.rb'
    - 'lib/recording_studio_downloadable/download_file.rb'
    - 'app/helpers/recording_studio_downloadable/application_helper.rb'
    - 'app/services/recording_studio_downloadable/services/generate_package.rb'
    - 'app/controllers/recording_studio_downloadable/packages_controller.rb'
    - 'lib/recording_studio_downloadable/invalidation.rb'
    - 'lib/recording_studio_downloadable/rate_limiter.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_downloadable/engine.rb'
    - 'lib/recording_studio_downloadable/authorization.rb'
    - 'lib/recording_studio_downloadable/sources/attachments.rb'
    - 'lib/recording_studio_downloadable/sources/manifest.rb'
    - 'lib/recording_studio_downloadable/download_file.rb'
    - 'app/helpers/recording_studio_downloadable/application_helper.rb'
    - 'app/services/recording_studio_downloadable/services/**/*'
    - 'lib/recording_studio_downloadable/invalidation.rb'

Style/ArgumentsForwarding:
  Exclude:
    - "test/**/*"

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# Don't require super in service initialize methods
Lint/MissingSuper:
  Exclude:
    - 'test/services/**/*'
    - 'app/services/**/*'
