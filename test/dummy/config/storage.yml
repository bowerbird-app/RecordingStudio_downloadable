test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2 (S3-compatible). Do not put Access Key / Secret in this file.
#
# Set in the environment (development smoke / ngrok):
#   DUMMY_ACTIVE_STORAGE_SERVICE=cloudflare_r2   # or amazon
#   DUMMY_AWS_ACCESS_KEY_ID=...
#   DUMMY_AWS_SECRET_ACCESS_KEY=...
#   DUMMY_AWS_REGION=auto
#   DUMMY_AWS_BUCKET=attachable-test
# Optional:
#   DUMMY_AWS_ENDPOINT=https://<accountid>.r2.cloudflarestorage.com
#
# Then restart the dummy Rails server. CORS is configured on the bucket, not here.
cloudflare_r2: &cloudflare_r2
  service: S3
  access_key_id: <%= ENV["DUMMY_AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["DUMMY_AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("DUMMY_AWS_REGION", "auto") %>
  bucket: <%= ENV.fetch("DUMMY_AWS_BUCKET", "attachable-test") %>
  endpoint: <%= ENV.fetch("DUMMY_AWS_ENDPOINT", "https://9f477c1bde4b257733da5704816779e1.r2.cloudflarestorage.com") %>
  force_path_style: true

amazon:
  <<: *cloudflare_r2
